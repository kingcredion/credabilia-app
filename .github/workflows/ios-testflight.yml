# Builds the iPhone app on a GitHub Mac and uploads it to TestFlight. Run it by hand: Actions > "iPhone app to TestFlight" > Run workflow.
# It is the backup for the Codemagic build (codemagic.yaml) and does the same job.
#
# One-time setup (Settings > Secrets and variables > Actions > New repository secret):
#   ASC_KEY_ID      the App Store Connect API key's Key ID (QX745V35DC)
#   ASC_ISSUER_ID   the Issuer ID shown at the top of App Store Connect > Users and Access > Integrations
#   ASC_KEY_P8      the full text of the key file AuthKey_QX745V35DC.p8 (including the BEGIN/END lines)
#   GOOGLE_MAPS_KEY the app's Google Maps key (restricted to capacitor://localhost and https://localhost)
# Signing is automatic: Xcode uses the API key to create/fetch the App Store certificate and profile for com.credabilia.app.
# If it stops with a message about permissions, create the API key with the Admin role instead of App Manager.
name: iPhone app to TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Public by design: these ship inside the app and the website anyway.
      VITE_SUPABASE_URL: https://zedgmuovulbyclprokub.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nniT-JQPu8EHnIn-H1OGtw_8uHk3n1l
      VITE_VAPID_PUBLIC_KEY: BCq76HcqtvVAa7VDD_2DdIMIFXnA-pA0rTpiSQHPPgR4rUjYH7UyW7YiDZc-a9u_qMq6_2gmmQb7CIxCpEuhxlI
      VITE_LISTING_DETAILS_ENABLED: 'true'
      VITE_APPLE_SIGNIN_ENABLED: 'true'
      VITE_DEMO_MODE: 'false'
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
      TEAM_ID: SQ8Y93MR22
      # TestFlight already holds builds 1-5; keep this above them. Each run adds one.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the web app and copy it into the iPhone project
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"

      - name: Archive the app (automatic signing)
        run: |
          NUMBER=$((100 + BUILD_NUMBER))
          echo "Build number $NUMBER"
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$NUMBER"

      - name: Export and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
