project_id = "credabilia-next"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5174"
additional_redirect_urls = ["http://localhost:5174/auth/callback", "http://127.0.0.1:5174/auth/callback"]
enable_signup = true

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[functions.extract-certificate]
# The handler validates every user JWT through auth.getUser().
# Disable legacy HMAC-only gateway verification for current signing keys.
verify_jwt = false

[functions.stripe-webhook]
# Stripe calls this directly with its own Stripe-Signature header, not a Supabase user JWT.
# The handler verifies authenticity via STRIPE_WEBHOOK_SECRET instead.
verify_jwt = false
